name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (static, Mock Mode only)
        run: npm run build
        env:
          # Project Pages are served from /<repo>/ — Cesium assets and fetches resolve from here.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_HOSTING: "true"
          VITE_DATA_MODE: MOCK
          # Ships in the public bundle by design: restrict this token in Cesium ion to the BOM
          # assets and to https://<user>.github.io as an allowed URL.
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
